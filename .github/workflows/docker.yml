name: Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: seenornot:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name smoke -p 127.0.0.1:3000:3000 -e APP_PASSWORD=ci-test seenornot:test
          trap 'docker logs smoke; docker rm -f smoke' EXIT
          curl --fail --retry 15 --retry-delay 2 --retry-all-errors http://127.0.0.1:3000/health
          curl --fail --user me:ci-test http://127.0.0.1:3000/ > /dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/)" = 401
          docker image inspect seenornot:test --format 'Image size reported by Docker: {{.Size}} bytes'
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
      - name: Publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify (optional)
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK_URL" ]; then
            echo 'Coolify webhook not configured; image is ready for manual deployment.'
            exit 0
          fi
          if [ -z "$COOLIFY_TOKEN" ]; then
            echo 'COOLIFY_TOKEN is required when COOLIFY_WEBHOOK_URL is configured.'
            exit 1
          fi
          curl --fail --silent --show-error --max-time 60 \
            --header "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK_URL"
